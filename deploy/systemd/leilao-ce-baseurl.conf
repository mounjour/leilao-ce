# Drop-in do systemd: faz o Streamlit servir sob /app (server.baseUrlPath).
# Destino: /etc/systemd/system/leilao-ce.service.d/baseurl.conf
# Reverter = apagar o arquivo + `systemctl daemon-reload` + restart.
# Usa variavel de ambiente (STREAMLIT_SERVER_BASE_URL_PATH) em vez de reescrever
# o ExecStart, entao nao depende dos demais flags da unit na VPS.
[Service]
Environment=STREAMLIT_SERVER_BASE_URL_PATH=app
