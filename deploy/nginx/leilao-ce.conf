# Achadin Leiloes — Nginx: landing estatica em / e Streamlit em /app/.
#
# Destino na VPS: /etc/nginx/sites-available/leilao-ce (o symlink em
# sites-enabled ja existe). Normalmente quem instala e o deploy/cutover-landing.sh,
# que faz backup, mostra o diff, roda `nginx -t` e reverte sozinho se algo falhar.
# Manualmente: compare com `diff -u` antes de sobrescrever.
#
# As linhas "managed by Certbot" seguem o formato que o `certbot --nginx` gera,
# para a renovacao do certificado continuar funcionando sem ajuste.

# Links antigos que apontavam para a raiz do app (e-mail de confirmacao e de
# recuperacao de senha, retorno do Stripe Checkout, links das paginas legais)
# continuam funcionando: a raiz agora e a landing, entao esses parametros mandam
# o visitante para /app/ com a query preservada.
map $args $achadin_legado_app {
    default 0;
    "~(^|&)(code|mode|payment|pagina|error|error_code|error_description)=" 1;
}

server {
    if ($host = achadinleiloes.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name achadinleiloes.tech;
    return 404; # managed by Certbot
}

server {
    listen 443 ssl; # managed by Certbot
    server_name achadinleiloes.tech;

    ssl_certificate /etc/letsencrypt/live/achadinleiloes.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/achadinleiloes.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    root /var/www/achadin;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ── Streamlit (area logada) ─────────────────────────────────────────
    # O Streamlit roda com baseUrlPath=app (drop-in do systemd), entao o
    # proxy_pass NAO leva URI: o caminho /app/... segue inteiro ate ele.
    location = /app {
        return 301 /app/$is_args$args;
    }

    location /app/ {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;

        # Mitiga o flash "Streamlit" no titulo da aba (ver SETUP_HOSTINGER_VPS.md).
        # Accept-Encoding vazio: sub_filter nao reescreve corpo comprimido.
        proxy_set_header Accept-Encoding "";
        sub_filter '<title>Streamlit</title>' '<title>Achadin Leilões</title>';
        sub_filter_once on;
    }

    # ── Landing estatica ────────────────────────────────────────────────
    location = / {
        if ($achadin_legado_app) {
            return 302 /app/?$args;
        }
        # sem legado: o index serve /index.html (location / abaixo)
    }

    location = /stats.json {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /404.html {
        internal;
    }

    location ~ /\. {
        deny all;
    }
}
