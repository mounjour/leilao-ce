# Blueprint do Render — site do Achadin Leiloes (dashboard.py / Streamlit).
#
# O que este arquivo cria: UM Web Service Python. Nao cria banco (o Supabase
# e externo) nem cron (o scraping continua no GitHub Actions, ver
# SETUP_GITHUB_ACTIONS.md). Passo a passo e o que preencher a mao:
# SETUP_RENDER.md.
#
# Depois de dar push nisto: Render -> New -> Blueprint -> aponta para o repo
# mounjour/leilao-ce. O Render le este arquivo e pede os valores marcados
# "sync: false" (os segredos).

services:
  - type: web
    name: leilao-ce
    runtime: python
    plan: standard          # 2 GB RAM / 1 CPU, sempre ligado. Trocar para
                            # "starter" (US$ 7) ou "pro" no painel nao exige
                            # mudar codigo.
    region: virginia        # US-East: menor latencia para o Ceara entre as
                            # regioes do Render (nao ha regiao no Brasil).
    branch: main
    autoDeploy: true        # cada push no main redeploya — inclusive os
                            # commits automaticos do scraper (leiloes.json
                            # 2x/dia). E o mesmo comportamento do Community
                            # Cloud hoje.
    numInstances: 1         # Streamlit guarda sessao em memoria; escala e
                            # vertical (plano maior), nao horizontal.
    buildCommand: pip install -r requirements-web.txt
    startCommand: >-
      streamlit run dashboard.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health

    envVars:
      # Versao do Python — igual a dos workflows (.github/workflows/*.yml).
      - key: PYTHON_VERSION
        value: "3.11.9"

      # URL publica e DEFINITIVA do app: a *.onrender.com que o Render gerar
      # (confirme o texto exato na tela — se "leilao-ce" estiver tomado ele
      # adiciona sufixo). Nao ha dominio proprio; este endereco e o final.
      # Sem barra no final.
      - key: APP_URL
        sync: false

      # Supabase (mesmos valores do .env local / secrets do Community Cloud).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

      # Stripe — use as chaves LIVE (sk_live_/pk_live_) se o site cobra cartao
      # de verdade; as de teste (sk_test_/pk_test_) servem para validar o
      # deploy sem cobrar.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_PLAN_PRICE_LABEL
        value: "R$ 47"

      # WhatsApp (Evolution API) — usado quando o usuario favorita um lote
      # (favorites.py). Mesma instancia do scraper/alertas.
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_INSTANCE
        sync: false

      # Opcionais (tem default no codigo — adicionar so se quiser mudar):
      #   SESSION_MAX_HOURS        (default 8)
      #   SESSION_IDLE_MINUTES     (default 60)
      #   SESSION_VERIFY_SECONDS   (default 300)
