name: Deploy do site (VPS)

# Entra na VPS via SSH, atualiza o repositorio e reinicia o servico do dashboard.
#
# Gatilhos:
# - push no main feito por pessoa (merge, commit manual);
# - fim do workflow do scraper ("Scraper LeilãoCE") com sucesso. Necessario
#   porque o scraper commita o leiloes.json com o GITHUB_TOKEN, e push feito
#   com o GITHUB_TOKEN NAO dispara outros workflows: sem o workflow_run, a VPS
#   so recebia os lotes novos quando alguem dava push manual;
# - manual, pela aba Actions.
#
# Setup: docs/contexto/setup/SETUP_HOSTINGER_VPS.md (base) e
# docs/contexto/setup/SETUP_ORACLE_FREE.md (diferencas da Oracle Cloud).

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Scraper LeilãoCE"]   # precisa bater com o `name:` do scraper.yml
    types: [completed]
    branches: [main]
  workflow_dispatch:   # permite rodar manualmente pela aba Actions

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    # No workflow_run, so faz deploy se o scraper terminou com sucesso.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/leilao-ce
            git fetch origin main
            git reset --hard origin/main
            source .venv/bin/activate
            pip install -q -r requirements-web.txt
            sudo systemctl restart leilao-ce
            sleep 2
            sudo systemctl is-active --quiet leilao-ce

            # Landing estatica: so publica depois do cutover (a pasta e criada por
            # deploy/cutover-landing.sh). Antes disso este passo e ignorado.
            if [ -d /var/www/achadin ]; then
              python scripts/gerar_stats_site.py
              rsync -a --delete --chmod=D755,F644 site/ /var/www/achadin/
            fi
