<html lang="pt-BR">
<head>

<title>OG image — Achadin Leilões</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    color: #e2e8f0;
    background:
      radial-gradient(900px 520px at 88% 8%, rgba(37,99,235,.38), transparent 60%),
      radial-gradient(700px 420px at 0% 110%, rgba(59,130,246,.18), transparent 60%),
      #0f1729;
    position: relative;
  }
  .wrap { position: absolute; inset: 0; padding: 64px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 38px; font-weight: 800; letter-spacing: -.01em; }
  .brand svg { width: 64px; height: 64px; }
  h1 { font-size: 82px; line-height: 1.06; font-weight: 800; letter-spacing: -.03em; max-width: 720px; }
  h1 span { color: #60a5fa; }
  .sub { margin-top: 24px; font-size: 30px; line-height: 1.35; font-weight: 500; color: #94a3b8; max-width: 660px; text-wrap: balance; }
  .foot { display: flex; align-items: center; gap: 22px; }
  .url { background: #2563eb; color: #fff; font-size: 30px; font-weight: 600; padding: 14px 30px; border-radius: 12px; }
  .tag { font-size: 26px; font-weight: 500; color: #94a3b8; }
  /* Selo grande da marca, no canto direito */
  .logo { position: absolute; right: 80px; top: 50%; transform: translateY(-50%); width: 250px; height: 250px;
          filter: drop-shadow(0 30px 60px rgba(37,99,235,.55)); }
</style>
</head>
<body>
  <div class="wrap">
